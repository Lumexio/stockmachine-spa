name: Bug report
description: Report a reproducible marketing site, theme, route, or download defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the URL, steps, viewport size, and selected theme.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing page
        - Pricing
        - Downloads or external links
        - Navigation or routing
        - Theme or responsive layout
        - GitHub Pages deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, and relevant console output.
    validations:
      required: true
